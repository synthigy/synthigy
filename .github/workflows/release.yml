# Release: push a v* tag -> build 4 combo uberjars -> publish jars +
# manifest.json + sha256sums.txt as a GitHub Release.
# Consumed by the portal CLI (synthigy up --db ... --observability ...):
#   releases/latest/download/manifest.json      <- version discovery
#   releases/download/<tag>/<asset>.jar         <- quota-free CDN download
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # builds only in the PUBLIC repo, from exported public source —
    # the private repo's tag triggers export.yml instead
    if: github.repository == 'synthigy/synthigy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Build combo uberjars
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          # httpkit is THE server — dropped from asset names (db x obs matrix)
          for combo in postgres:httpkit:duckdb sqlite:httpkit:duckdb postgres:httpkit:clickhouse sqlite:httpkit:clickhouse; do
            SYNTHIGY_COMBO="$combo" clojure -T:build uber
            db=${combo%%:*}; obs=${combo##*:}
            cp "target/synthigy-${combo//:/-}.jar" "dist/synthigy-${db}-${obs}-${TAG}.jar"
          done
      - name: Manifest + checksums
        run: |
          cd dist
          sha256sum *.jar > sha256sums.txt
          python3 - "$GITHUB_REF_NAME" > manifest.json <<'EOF'
          import hashlib, json, pathlib, sys
          tag = sys.argv[1]
          combos = {}
          for jar in sorted(pathlib.Path('.').glob('*.jar')):
              # synthigy-<db>-<obs>-<tag>.jar
              db, obs = jar.name.split('-')[1:3]
              combos[f"{db}-{obs}"] = {
                  "asset": jar.name,
                  "sha256": hashlib.sha256(jar.read_bytes()).hexdigest(),
              }
          print(json.dumps({"schema": 1, "version": tag,
                            "jre": {"feature_version": 21},
                            "combos": combos}, indent=2))
          EOF
          cat manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
