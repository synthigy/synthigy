<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Error</title>
  <link rel="icon" type="image/png" href="/oauth/images/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono&display=swap">
  <link rel="stylesheet" href="/oauth/css/error.css">
</head>
<body>
  <!--
    CONTRACT
    ========
    The server redirects here as:  /login/default/error.html?error=<code>&secure=<bool>
    (+ optional context keys, e.g. client-name, invalid-value). No POST, no token.
    `secure=true` → a potentially malicious client: warn "do not enter credentials".
    Every code is listed below and in the console: System -> Login pages -> Page reference.
  -->
  <div class="oauth-container">
    <div class="error-card">
      <div class="header"><h2 id="title">Authorization Error</h2></div>
      <div class="message" id="message"></div>
      <div class="error-code" id="code"></div>
      <div class="help-text" id="help" hidden>
        If you were redirected here unexpectedly, close this window.
      </div>
    </div>
  </div>

  <script src="/oauth/js/starfield.js"></script>
  <script>
    var q = new URLSearchParams(location.search);
    var error = q.get('error') || 'unknown';
    var secure = q.get('secure') === 'true';

    // Every code the server sends here — generated from oauth/page/error.clj.
    var TITLES = {
      client_not_registered: "Unknown Application",
      corrupt_session: "Session Error",
      invalid_login_page: "Configuration Error",
      missing_redirect: "Invalid Request",
      missing_response_type: "Invalid Request",
      no_redirections: "Authorization Blocked",
      redirect_missmatch: "Authorization Blocked",
      unsupported_grant_type: "Unsupported Request"
    };
    var MESSAGES = {
      client_not_registered: "This application is not recognized by the authorization server. Do not enter any credentials.",
      corrupt_session: "Your authorization session could not be verified. Please try again or contact support.",
      missing_redirect: "The authorization request is missing required information. Please contact the application developer.",
      missing_response_type: "The authorization request is incomplete. Please contact the application developer.",
      no_redirections: "This application has no configured redirect addresses. The authorization request cannot be completed safely.",
      redirect_missmatch: "The return address provided by this application doesn't match its configuration. Do not enter any credentials.",
      unsupported_grant_type: "The requested authorization method is not supported. Please contact the application developer.",
      invalid_login_page: 'App "' + (q.get('client-name') || '?') + '" has an invalid Login page setting ("' +
        (q.get('invalid-value') || '') + '"). It must name a login page bundle. Contact the application developer.'
    };

    document.getElementById('title').textContent = TITLES[error] || 'Authorization Error';
    document.getElementById('message').textContent =
      MESSAGES[error] || 'An error occurred during authorization. Please contact support.';
    document.getElementById('code').textContent = 'Error: ' + error;

    if (secure) {
      document.querySelector('.error-card').classList.add('security');
      document.getElementById('message').classList.add('security');
      document.getElementById('help').hidden = false;
    }
  </script>
</body>
</html>
