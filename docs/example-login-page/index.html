<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Acme</title>
  <link rel="icon" type="image/png" href="/oauth/images/favicon.png">
  <link rel="preload" href="/oauth/css/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <!-- Reusing the built-in stylesheet (it brings its own self-hosted fonts) so this
       works out of the box. Swap it for your own to rebrand — the contract is the
       form below, not the CSS. -->
  <link rel="stylesheet" href="/oauth/css/login.css">
  <style>
    /* Your brand. The built-in pages put the Synthigy lockup (.sy-lockup) here. */
    .acme-mark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 100%;
      padding-left: 14px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--sy-text-pp);
    }

    .acme-mark svg {
      width: 17px;
      height: 17px;
    }

    #federated > .sy-divider {
      margin-top: 20px;
    }

    .sy-card {
      transition: opacity 0.16s ease-out;
    }

    .acme-loading .sy-card {
      opacity: 0;
    }
  </style>
  <!-- Keeps the card transparent until the page script has its final content (the
       provider buttons), so it never grows in front of the person. 1.5s at most. -->
  <script>
    document.documentElement.classList.add('acme-loading');
    setTimeout(function () { document.documentElement.classList.remove('acme-loading'); }, 1500);
  </script>
</head>
<body>
  <!--
    CONTRACT
    ========
    The OAuth server redirected the browser here as:  <this-page>?state=<opaque>
    `state` is an encrypted, tamper-proof blob (it IS the CSRF/replay protection).

    This page is served under /login/<name>/ (GET-only), so the form CANNOT post to
    itself. It must:
      1. POST to /oauth/login  (explicit action)
      2. carry `state` back — read from THIS url's ?state= into a hidden field.

    We POST via fetch (JSON mode) so wrong-password errors stay on THIS page.
    A plain <form action="/oauth/login"> also works, but on error the server
    re-renders the built-in page and your branding is lost.

    LAYOUT
    ======
    The same shell as the built-in pages: a 36px brand bar (.sy-bar), the card in
    the middle (.sy-stage > .sy-card) and a status line at the bottom (.sy-status).
  -->
  <div class="sy-shell">
    <header class="sy-bar">
      <span class="acme-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 21.5 20h-19z"/></svg>
        <span>Acme</span>
      </span>
      <span class="sy-spacer"></span>
    </header>

    <main class="sy-stage">
      <div class="sy-card">
        <div class="sy-card-head">
          <h1 class="sy-card-title">Sign in</h1>
          <!-- The voice row: a fixed-height line under the title. It shows the sub
               text; SynthigyPage.message('voice', text, tone) puts a message in its
               place, and message('voice', '') brings the sub text back. Nothing in
               the card moves when a message appears. -->
          <div class="sy-voice" id="voice" aria-live="polite">
            <p class="sy-card-sub">Use your Acme account to continue.</p>
          </div>
        </div>

        <div class="sy-card-body">
          <form class="sy-form" id="login" method="post" action="/oauth/login">
            <input type="hidden" name="state" id="state">
            <div class="sy-field">
              <div class="sy-label-row">
                <label class="sy-label" for="username">Username</label>
              </div>
              <div class="sy-control">
                <input class="sy-input" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false">
              </div>
            </div>
            <div class="sy-field">
              <div class="sy-label-row">
                <label class="sy-label" for="password">Password</label>
                <!-- shell.js shows this tag while Caps Lock is on. -->
                <span class="sy-tag" data-sy-caps="password">Caps Lock</span>
              </div>
              <div class="sy-control">
                <input class="sy-input" id="password" name="password" type="password" autocomplete="current-password" autocorrect="off" spellcheck="false">
                <!-- shell.js toggles the password between hidden and shown. -->
                <button class="sy-input-btn" type="button" data-sy-reveal="password" aria-label="Show password" aria-pressed="false">
                  <svg class="when-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="when-shown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                </button>
              </div>
            </div>
            <!-- While the request runs, SynthigyPage.busy(form, true) swaps the label
                 for the spinner; the button keeps its size. -->
            <button class="sy-btn sy-btn--primary" type="submit">
              <span class="sy-btn-label">Sign In</span>
              <span class="sy-spin" aria-hidden="true"></span>
            </button>
          </form>

          <!-- Federated "Continue with X" buttons — populated at load time from
               GET /oauth/federated/providers (public, never exposes secrets).
               Stays empty (and invisible) when no provider is configured. -->
          <div id="federated"></div>
        </div>

        <!-- Cancel: GET /oauth/login?state=<state>&cancel=1 ends the flow on the
             server — back to the app with error=access_denied, or to the status page
             for a device sign-in. Removed when there is no state. -->
        <div class="sy-card-foot" id="cancel">
          <a class="sy-link" id="cancel-link" href="/oauth/login">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>Cancel this sign-in</span>
          </a>
        </div>
      </div>
    </main>

    <footer class="sy-status">
      <span class="sy-status-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <!-- shell.js writes location.host into every [data-sy-host]. -->
        <span data-sy-host></span>
      </span>
      <span class="sy-spacer"></span>
      <span class="sy-status-item"><span class="sy-key">Enter</span><span>sign in</span></span>
    </footer>
  </div>

  <script src="/oauth/js/starfield.js"></script>
  <!-- shell.js: window.SynthigyPage.message / .busy, host, Caps Lock, password reveal. -->
  <script src="/oauth/js/shell.js"></script>
  <script>
    (function () {
      var page = window.SynthigyPage;
      var form = document.getElementById('login');
      var user = document.getElementById('username');
      var pass = document.getElementById('password');
      var query = new URLSearchParams(location.search);

      // Carry the opaque state from this page's URL into the form.
      var STATE = query.get('state') || '';
      document.getElementById('state').value = STATE;
      // The app's OIDC login_hint, when it sent one, pre-fills the username.
      var HINT = query.get('login_hint');
      if (HINT) user.value = HINT;

      if (STATE) {
        document.getElementById('cancel-link').href =
          '/oauth/login?' + new URLSearchParams({ state: STATE, cancel: 1 });
      } else {
        document.getElementById('cancel').remove();
      }

      // Federated sign-in: discover active providers and render one link each.
      // The link target is a plain server redirect — /oauth/federated/start
      // owns PKCE/nonce/callback; this page only forwards the SAME opaque state
      // the password form round-trips. No state (direct visit) → no buttons.
      // The card is shown once this settles; if you know your providers, write
      // the links into the markup instead and call ready() right away.
      function ready() { document.documentElement.classList.remove('acme-loading'); }

      if (STATE) {
        fetch('/oauth/federated/providers')
          .then(function (r) { return r.json(); })
          .then(function (providers) {
            if (!providers.length) return;
            // Same markup the built-in page renders, so login.css styles it:
            // an "or" .sy-divider, then a .sy-stack of .sy-btn--secondary links.
            var box = document.getElementById('federated');
            var divider = document.createElement('div');
            divider.className = 'sy-divider';
            divider.textContent = 'or';
            box.appendChild(divider);
            var list = document.createElement('div');
            list.className = 'sy-stack';
            providers.forEach(function (p) {
              var a = document.createElement('a');
              a.className = 'sy-btn sy-btn--secondary';
              a.href = '/oauth/federated/start?' +
                new URLSearchParams({ provider: p.name, state: STATE });
              // `logo` is present when an admin set a logo URL for the provider.
              if (p.logo) {
                var img = document.createElement('img');
                img.src = p.logo;
                img.alt = '';
                a.appendChild(img);
              }
              var label = document.createElement('span');
              label.className = 'sy-btn-label';
              label.textContent = 'Continue with ' + p.label;
              a.appendChild(label);
              list.appendChild(a);
            });
            box.appendChild(list);
          })
          .catch(function () { /* no providers endpoint → password-only page */ })
          .then(ready);
      } else {
        ready();
      }

      // Every code the server can answer with — see System -> Login pages -> Page reference.
      // JSON answers from POST /oauth/login:
      var ERRORS = {
        credentials: 'Wrong credentials. Check your username and password.',
        expired_code: 'This sign-in took too long. Start again from the app.',
        device_code_expired: 'The device code expired. Start again on the device.',
        already_authorized: 'This device code was already used.',
        ip_address: 'Your network changed during sign-in. Start again from the app.',
        user_agent: 'Your browser changed during sign-in. Start again from the app.',
        challenge: 'The device confirmation did not match. Start again on the device.',
        broken_flow: 'Open this page from the app you are signing in to.',
        unknown: 'Open this page from the app you are signing in to.'
      };
      // ?error= codes a federated sign-in (Continue with X) sends back here:
      var FEDERATED = {
        idp_access_denied: 'Sign-in was cancelled. Try again, or use your password.',
        idp_consent_required: 'Sign-in was cancelled. Try again, or use your password.',
        idp_login_required: 'Sign-in was cancelled. Try again, or use your password.',
        idp_interaction_required: 'Sign-in was cancelled. Try again, or use your password.',
        provider_unknown: 'That sign-in method is no longer available.',
        provider_disabled: 'That sign-in method is switched off.',
        provider_unsupported: 'Could not reach that provider. Try again.',
        token_invalid: "That provider's response could not be verified.",
        no_code: 'That provider sent no authorization code.',
        state_invalid: 'That sign-in link expired. Try again.',
        expired_code: 'This sign-in took too long. Start again from the app.',
        not_linked: "That account isn't linked here. Use another method.",
        email_exists: 'An account already uses that email address.',
        provision_failed: 'Could not create an account from that provider.',
        callback_error: 'Something went wrong signing in. Try again.'
      };

      var code = query.get('error');
      if (code) {
        page.message('voice', FEDERATED[code] || (code.indexOf('idp_') === 0
          ? 'The provider refused: ' + code.slice(4).replace(/_/g, ' ') + '.'
          : 'Could not sign in. Try again.'));
      } else if (!STATE) {
        page.message('voice', 'Open this page from the app you are signing in to.', 'warn');
      }

      // Wrong credentials outline both fields until the person types again.
      [user, pass].forEach(function (input) {
        input.addEventListener('input', function () { input.removeAttribute('aria-invalid'); });
      });

      var pending = false;

      function fail(text, credentials) {
        pending = false;
        page.busy(form, false);
        page.message('voice', text);
        if (credentials) {
          user.setAttribute('aria-invalid', 'true');
          pass.setAttribute('aria-invalid', 'true');
          pass.focus();
          pass.select();
        }
      }

      // Back from the app restores this page from the browser cache mid-submit; give the form back.
      addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        pending = false;
        page.busy(form, false);
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (pending) return;
        pending = true;
        page.message('voice', '');
        page.busy(form, true);
        var data;
        try {
          var res = await fetch('/oauth/login', {
            method: 'POST',
            credentials: 'include', // so the idsrv.session cookie sticks on success
            headers: { 'Accept': 'application/json',
                       'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams(new FormData(form))
          });
          data = await res.json();
        } catch (err) {
          fail('Could not reach the sign-in server. Try again.');
          return;
        }
        // On success the button stays busy while the browser navigates away.
        if (data.ok && data.redirect) { location = data.redirect; return; }
        if (data.ok && data.form_post) {
          // response_mode=form_post — build+submit a POST form to the client
          var f = document.createElement('form');
          f.method = 'post'; f.action = data.form_post.url;
          Object.entries(data.form_post.params).forEach(function (kv) {
            var i = document.createElement('input');
            i.type = 'hidden'; i.name = kv[0]; i.value = kv[1]; f.appendChild(i);
          });
          document.body.appendChild(f); f.submit(); return;
        }
        fail(ERRORS[data.error] || ('Sign-in failed: ' + (data.error || 'unknown')),
             data.error === 'credentials');
      });
    })();
  </script>
  <!-- login.js: focuses the username, or the password when the username is pre-filled. -->
  <script src="/oauth/js/login.js"></script>
</body>
</html>
