<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Confirmation</title>
  <link rel="icon" type="image/png" href="/oauth/images/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/oauth/css/device.css">
</head>
<body>
  <!--
    CONTRACT
    ========
    The server redirects the browser here two ways:
      entry:   /login/device.html                       (no user_code)
      confirm: /login/device.html?user_code=XXXX-XXXX   (+ a device_confirm cookie)

    Both POST to /oauth/device/activate (explicit action — this page is GET-only):
      entry   → send `user_code`         (server finds the code, hands off to login)
      confirm → send `action=confirm|cancel` only — the device_confirm cookie
                (SameSite=Lax, set by the server on the redirect) carries the rest.
                No token in the page; the browser attaches the cookie for you.
  -->
  <div class="oauth-container">
    <div class="device-card"><div class="inner">
      <div class="header"><h1>Device Confirmation</h1></div>
      <div class="description" id="desc"></div>
      <form class="device-form" method="post" action="/oauth/device/activate">
        <div class="code-boxes" id="boxes"></div>
        <input type="hidden" name="user_code" id="user_code">
        <div class="error"></div>
        <div class="actions" id="actions"></div>
      </form>
    </div></div>
  </div>

  <script src="/oauth/js/starfield.js"></script>
  <script>
    var code = new URLSearchParams(location.search).get('user_code');
    var confirming = !!code;
    var chars = confirming ? code.replace('-', '').split('') : [];
    var boxes = document.getElementById('boxes');

    for (var i = 0; i < 8; i++) {
      if (i === 4) {
        var sep = document.createElement('span');
        sep.className = 'code-sep';
        boxes.appendChild(sep);
      }
      var b = document.createElement('input');
      b.className = 'code-box';
      b.maxLength = 1;
      b.autocapitalize = 'characters';
      b.spellcheck = false;
      if (confirming) { b.value = chars[i] || ''; b.readOnly = true; b.tabIndex = -1; }
      else { b.setAttribute('aria-label', 'Code character ' + (i + 1)); }
      boxes.appendChild(b);
    }

    document.getElementById('desc').textContent = confirming
      ? 'Confirm that the following code is used for device authorization'
      : 'Type in the device code displayed on your device';

    document.getElementById('actions').innerHTML = confirming
      ? '<div><button class="confirm" name="action" value="confirm">Confirm</button>'
        + '<button class="cancel" name="action" value="cancel">Cancel</button></div>'
      : '<div><button class="continue">Continue</button></div>';

    // Confirm mode carries state in the cookie, not the form — drop the hidden field.
    if (confirming) document.getElementById('user_code').remove();
  </script>
  <!-- Drives the editable boxes (entry mode) into #user_code; skips read-only. -->
  <script src="/oauth/js/device.js"></script>
</body>
</html>
